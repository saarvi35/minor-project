apiVersion: v1
kind: ConfigMap
metadata:
  name: workzen-config
  namespace: workzen
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1,workzen-backend,workzen-backend.workzen.svc.cluster.local"
  CORS_ALLOWED_ORIGINS: ""
  CSRF_TRUSTED_ORIGINS: ""
  FRONTEND_BASE_URL: "http://localhost:30080"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  SECURE_SSL_REDIRECT: "False"
  SESSION_COOKIE_SECURE: "False"
  CSRF_COOKIE_SECURE: "False"
  SECURE_HSTS_SECONDS: "0"
  POSTGRES_DB: "workzen"
  POSTGRES_USER: "workzen"
