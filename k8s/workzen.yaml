apiVersion: apps/v1
kind: Deployment
metadata:
  name: workzen-backend
  namespace: workzen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workzen-backend
  template:
    metadata:
      labels:
        app: workzen-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      initContainers:
        - name: migrate
          image: workzen-backend:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "python manage.py migrate --noinput"]
          envFrom:
            - configMapRef: { name: workzen-config }
            - secretRef: { name: workzen-secrets }
      containers:
        - name: backend
          image: workzen-backend:local
          imagePullPolicy: IfNotPresent
          command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--timeout", "60"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: workzen-config }
            - secretRef: { name: workzen-secrets }
          readinessProbe:
            httpGet: { path: /api/health/, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health/, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: workzen-backend
  namespace: workzen
spec:
  selector:
    app: workzen-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workzen-worker
  namespace: workzen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workzen-worker
  template:
    metadata:
      labels:
        app: workzen-worker
    spec:
      containers:
        - name: worker
          image: workzen-backend:local
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "config", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef: { name: workzen-config }
            - secretRef: { name: workzen-secrets }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workzen-beat
  namespace: workzen
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app: workzen-beat
  template:
    metadata:
      labels:
        app: workzen-beat
    spec:
      containers:
        - name: beat
          image: workzen-backend:local
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "config", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef: { name: workzen-config }
            - secretRef: { name: workzen-secrets }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workzen-frontend
  namespace: workzen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workzen-frontend
  template:
    metadata:
      labels:
        app: workzen-frontend
    spec:
      containers:
        - name: frontend
          image: workzen-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: workzen-frontend
  namespace: workzen
spec:
  type: NodePort
  selector:
    app: workzen-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
