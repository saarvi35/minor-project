services:
  redis:
    image: redis:7-alpine
    profiles: ["app"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    profiles: ["app"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/db.sqlite3
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - workzen_sqlite_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health/', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: ./backend
    profiles: ["app"]
    env_file: ./backend/.env
    command: celery -A config worker --loglevel=info --pool=solo
    environment:
      DATABASE_URL: sqlite:////app/data/db.sqlite3
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - workzen_sqlite_data:/app/data

  beat:
    build: ./backend
    profiles: ["app"]
    env_file: ./backend/.env
    command: celery -A config beat --loglevel=info
    environment:
      DATABASE_URL: sqlite:////app/data/db.sqlite3
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - workzen_sqlite_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    profiles: ["app"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  workzen_sqlite_data:
