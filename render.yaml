# Render Blueprint for WorkZen. Step-by-step guide: docs/render-deployment.md
#
# Services:
#   workzen-api    Django API (Docker) with a persistent disk for uploaded files
#   workzen-worker Celery worker with the beat scheduler embedded (SLA watchdog)
#   workzen-web    React frontend (static site)
#   workzen-redis  Key Value (Redis) broker
#   workzen-db     PostgreSQL
#
# SECRET_KEY lives in the workzen-shared group because env groups cannot reference databases/services.
# Values marked "sync: false" are asked for once when the Blueprint is created.

databases:
  - name: workzen-db
    databaseName: workzen
    user: workzen
    plan: basic-256mb

services:
  - type: keyvalue
    name: workzen-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: workzen-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    disk:
      name: workzen-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - fromGroup: workzen-shared
      - key: DATABASE_URL
        fromDatabase:
          name: workzen-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: workzen-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: workzen-redis
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: USE_PROXY_SSL_HEADER
        value: "True"
      - key: SERVE_MEDIA_FILES
        value: "True"
      - key: WEB_CONCURRENCY
        value: "2"
      # Set to "true" to load the demo companies on deploy (presentations), then set back to "false".
      - key: SEED_DEMO_DATA
        value: "false"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: PRIVATE_MEDIA_ROOT
        value: /var/data/private_media
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_REQUEST_TIMEOUT_SECONDS
        value: "45"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  - type: worker
    name: workzen-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config worker --beat --loglevel=info --concurrency=2
    envVars:
      - fromGroup: workzen-shared
      - key: DATABASE_URL
        fromDatabase:
          name: workzen-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: workzen-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: workzen-redis
          property: connectionString
      - key: DEBUG
        value: "False"

  - type: web
    name: workzen-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

envVarGroups:
  - name: workzen-shared
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12"
