# Render Blueprint for WorkZen on FREE plans only. Step-by-step guide: docs/render-deployment.md
# The full paid setup (persistent disk, Redis, Celery worker) is in render.paid.yaml.
#
# Free-plan limits: the API sleeps after ~15 minutes idle (first request is slow), uploaded files
# are lost when it restarts or redeploys, the free database expires after a limited period, and
# there is no Celery worker, so the scheduled SLA watchdog does not run.
#
# Values marked "sync: false" are asked for once when the Blueprint is created.

databases:
  - name: workzen-db
    databaseName: workzen
    user: workzen
    plan: free
    region: oregon

services:
  - type: web
    name: workzen-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: workzen-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: USE_PROXY_SSL_HEADER
        value: "True"
      - key: SERVE_MEDIA_FILES
        value: "True"
      - key: WEB_CONCURRENCY
        value: "1"
      # Set to "true" to load the demo companies on deploy (presentations), then set back to "false".
      - key: SEED_DEMO_DATA
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_REQUEST_TIMEOUT_SECONDS
        value: "45"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  - type: web
    name: workzen-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
