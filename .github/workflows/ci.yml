name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DEBUG: "False"
      SECRET_KEY: ci-only-validation-secret-9d7f3a61c8e4b2f0-rotate-before-production
      ALLOWED_HOSTS: ci.example.test
      CORS_ALLOWED_ORIGINS: https://ci.example.test
      CSRF_TRUSTED_ORIGINS: https://ci.example.test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-sla.txt -r requirements-onboarding.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python manage.py check --deploy
      - run: python -m compileall -q .
      - run: python manage.py test accounts.tests_security companies.tests companies.tests_security companies.tests_integrity dashboard.tests_integrity hr.tests_security projects.tests tasks.tests tasks.tests_integrity workflows.tests ai_insights.tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
